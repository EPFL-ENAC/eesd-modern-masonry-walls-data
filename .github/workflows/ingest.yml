# Folds each accepted submission into data/ and pushes the result to the base
# branch (main or dev). A push with GITHUB_TOKEN starts no workflow, so the
# action then starts changed.yml by workflow_dispatch (needs actions: write).
name: ingest

on:
  pull_request:
    types: [closed]
    branches: [main, dev]

jobs:
  ingest:
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'contrib/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    concurrency:
      group: data-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          lfs: false
      - uses: astral-sh/setup-uv@v6
      - uses: EPFL-ENAC/enacit4r-contrib/ingest@0.6.0
        with:
          pr-number: ${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.base.ref }}
          command: make ingest SUBMISSION="$SUBMISSION"
          deploy-workflow: changed.yml

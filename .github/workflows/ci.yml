name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "tools/uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  submissions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: List changed submissions
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ids=$(git diff --name-only "$BASE_SHA" HEAD -- submissions \
            | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.ids != ''
        with:
          enable-cache: true
          cache-dependency-glob: "tools/uv.lock"
      - name: Check each changed submission
        if: steps.changed.outputs.ids != ''
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          status=0
          for id in $IDS; do
            if [ ! -d "submissions/$id" ]; then echo "skip $id: removed"; continue; fi
            echo "::group::submissions/$id"
            make check SUBMISSION="submissions/$id" || status=1
            echo "::endgroup::"
          done
          exit $status

[project]
name = "mmw-data"
version = "0.2.0"
description = "Check, ingest and withdraw tools for the Modern Masonry Database data"
requires-python = ">=3.12"
dependencies = ["enacit4r-contrib"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv.sources]
enacit4r-contrib = { git = "https://github.com/EPFL-ENAC/enacit4r-contrib", tag = "0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmw_data"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
